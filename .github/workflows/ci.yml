name: CI

on:
  push:
    branches: [main]
    paths:
      - 'mail-vue/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'mail-vue/**'
      - '.github/workflows/ci.yml'

jobs:
  # 密钥扫描兜底（兑现 F007 红线段的 CI 端防线）
  gitleaks:
    name: 🔐 Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 静态检查 + 构建
  lint-build:
    name: 🧹 Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mail-vue
    steps:
      - uses: actions/checkout@v4

      # version 必须显式指定：mail-vue/package.json 无 packageManager 字段时，
      # pnpm/action-setup 会直接报 "No pnpm version is specified" 退出（曾导致 CI 全红）。
      # 锁在 10 而非上游 deploy 的 11：pnpm 11 新增 minimumReleaseAge 供应链策略，
      # 会拒绝 lock 中近期发布的传递依赖（实测 @types/ws@8.18.2 / std-env@4.3.0 被拒），
      # 而本 lock 由 pnpm 10.28.2 生成，10 可完整消费。升级需先解决该策略。
      - name: ⚙ Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          # setup-node 的 cwd 是仓库根（defaults.run.working-directory 不影响 uses），
          # 故此处必须是根相对路径。
          cache-dependency-path: 'mail-vue/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # typecheck job 随 F001 接入
      # 已知上游依赖冲突：@vitejs/plugin-vue@5.2.4 声明 peer vite ^5||^6，而实际 vite 7.1.5。
      # 建议后续升 @vitejs/plugin-vue 至 v6 根治（不属本特性范围）。
