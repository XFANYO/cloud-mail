name: CI

on:
  push:
    branches: [main]
    paths:
      - 'mail-vue/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'mail-vue/**'
      - '.github/workflows/ci.yml'

jobs:
  # 密钥扫描兜底（兑现 F007 红线段的 CI 端防线）
  gitleaks:
    name: 🔐 Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 静态检查 + 构建
  lint-build:
    name: 🧹 Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mail-vue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './mail-vue/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # typecheck job 随 F001 接入
