name: CI

on:
  push:
    branches: [main]
    paths:
      - 'mail-vue/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'mail-vue/**'
      - '.github/workflows/ci.yml'

jobs:
  # 密钥扫描兜底（兑现 F007 红线段的 CI 端防线）
  gitleaks:
    name: 🔐 Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 静态检查 + 构建
  lint-build:
    name: 🧹 Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mail-vue
    steps:
      - uses: actions/checkout@v4

      - name: ⚙ Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './mail-vue/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # typecheck job 随 F001 接入
      # 已知上游依赖冲突：@vitejs/plugin-vue@5.2.4 声明 peer vite ^5||^6，而实际 vite 7.1.5。
      # 建议后续升 @vitejs/plugin-vue 至 v6 根治（不属本特性范围）。
